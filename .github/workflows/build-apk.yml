name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Pillow
        run: pip3 install pillow

      - name: Prepare Capacitor + CynExtra logo (icon + splash)
        run: |
          set -e
          rm -rf www android
          mkdir -p www
          for f in index.html login.html signup.html chat.html library.html projects.html plugins.html profile.html settings.html pricing.html terms.html tools.html ultimate.html; do
            [ -f "$f" ] && cp -f "$f" www/
          done
          cp -rf assets www/

          printf '%s\n' '{' '  "name": "cynextra-ai",' '  "version": "1.0.0",' '  "private": true' '}' > package.json

          cat > capacitor.config.json << 'CFG'
          {
            "appId": "com.cynextra.ai",
            "appName": "CynExtra-AI",
            "webDir": "www",
            "server": { "androidScheme": "https" },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 2500,
                "launchAutoHide": true,
                "backgroundColor": "#0a0e1c",
                "androidSplashResourceName": "splash",
                "androidScaleType": "CENTER",
                "showSpinner": false,
                "splashFullScreen": true,
                "splashImmersive": true
              }
            }
          }
          CFG

          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/splash-screen@6
          npx cap add android
          npx cap sync android

          python3 << 'PY'
          from PIL import Image, ImageDraw
          import os, glob

          logo = Image.open("assets/images/logo.png").convert("RGBA")
          BG = (10, 14, 28, 255)  # #0a0e1c
          res = "android/app/src/main/res"

          def trim(im, t=18):
              px = im.load(); w, h = im.size
              minx, miny, maxx, maxy = w, h, 0, 0; found = False
              for y in range(h):
                  for x in range(w):
                      r, g, b, a = px[x, y]
                      if a > 10 and (r > t or g > t or b > t):
                          found = True
                          minx, miny = min(minx, x), min(miny, y)
                          maxx, maxy = max(maxx, x), max(maxy, y)
              if not found:
                  return im
              p = 4
              return im.crop((max(0, minx-p), max(0, miny-p), min(w, maxx+1+p), min(h, maxy+1+p)))

          logo = trim(logo)

          def square_icon(size, scale=0.72):
              c = Image.new("RGBA", (size, size), BG)
              t = int(size * scale)
              lw, lh = logo.size
              s = t / max(lw, lh)
              nw, nh = max(1, int(lw * s)), max(1, int(lh * s))
              r = logo.resize((nw, nh), Image.Resampling.LANCZOS)
              c.paste(r, ((size - nw) // 2, (size - nh) // 2), r)
              return c

          def round_icon(size):
              img = square_icon(size)
              m = Image.new("L", (size, size), 0)
              ImageDraw.Draw(m).ellipse((0, 0, size - 1, size - 1), fill=255)
              img.putalpha(m)
              return img

          def fg_icon(size, scale=0.55):
              c = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              t = int(size * scale)
              lw, lh = logo.size
              s = t / max(lw, lh)
              nw, nh = max(1, int(lw * s)), max(1, int(lh * s))
              r = logo.resize((nw, nh), Image.Resampling.LANCZOS)
              c.paste(r, ((size - nw) // 2, (size - nh) // 2), r)
              return c

          def splash_image(w, h, logo_scale=0.28):
              # Full-screen splash: dark bg + centered CX logo
              c = Image.new("RGBA", (w, h), BG)
              t = int(min(w, h) * logo_scale)
              lw, lh = logo.size
              s = t / max(lw, lh)
              nw, nh = max(1, int(lw * s)), max(1, int(lh * s))
              r = logo.resize((nw, nh), Image.Resampling.LANCZOS)
              c.paste(r, ((w - nw) // 2, (h - nh) // 2), r)
              return c

          # --- Launcher icons ---
          legacy = {"mipmap-mdpi": 48, "mipmap-hdpi": 72, "mipmap-xhdpi": 96, "mipmap-xxhdpi": 144, "mipmap-xxxhdpi": 192}
          adaptive = {"mipmap-mdpi": 108, "mipmap-hdpi": 162, "mipmap-xhdpi": 216, "mipmap-xxhdpi": 324, "mipmap-xxxhdpi": 432}
          for folder, size in legacy.items():
              d = os.path.join(res, folder)
              os.makedirs(d, exist_ok=True)
              square_icon(size).save(os.path.join(d, "ic_launcher.png"))
              round_icon(size).save(os.path.join(d, "ic_launcher_round.png"))
          for folder, size in adaptive.items():
              d = os.path.join(res, folder)
              os.makedirs(d, exist_ok=True)
              fg_icon(size).save(os.path.join(d, "ic_launcher_foreground.png"))

          anydpi = os.path.join(res, "mipmap-anydpi-v26")
          os.makedirs(anydpi, exist_ok=True)
          xml = """<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          """
          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              open(os.path.join(anydpi, name), "w").write(xml)

          values = os.path.join(res, "values")
          os.makedirs(values, exist_ok=True)
          open(os.path.join(values, "ic_launcher_background.xml"), "w").write(
              """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0A0E1C</color>
          </resources>
          """
          )

          # --- Native splash (replace Capacitor default X) ---
          # Common Capacitor locations
          splash_dirs = [
              os.path.join(res, "drawable"),
              os.path.join(res, "drawable-port"),
              os.path.join(res, "drawable-land"),
              os.path.join(res, "drawable-hdpi"),
              os.path.join(res, "drawable-mdpi"),
              os.path.join(res, "drawable-xhdpi"),
              os.path.join(res, "drawable-xxhdpi"),
              os.path.join(res, "drawable-xxxhdpi"),
          ]
          for d in splash_dirs:
              os.makedirs(d, exist_ok=True)

          # Main splash resource used by Capacitor
          splash = splash_image(1080, 1920, logo_scale=0.32)
          splash.save(os.path.join(res, "drawable", "splash.png"))
          splash.save(os.path.join(res, "drawable-port", "splash.png"))
          splash_image(1920, 1080, 0.28).save(os.path.join(res, "drawable-land", "splash.png"))

          # Density variants
          for folder, size in [
              ("drawable-mdpi", (320, 480)),
              ("drawable-hdpi", (480, 800)),
              ("drawable-xhdpi", (720, 1280)),
              ("drawable-xxhdpi", (1080, 1920)),
              ("drawable-xxxhdpi", (1440, 2560)),
          ]:
              d = os.path.join(res, folder)
              os.makedirs(d, exist_ok=True)
              splash_image(size[0], size[1], 0.32).save(os.path.join(d, "splash.png"))

          # Also replace any existing capacitor splash/splash.png named files
          for path in glob.glob(res + "/**/splash*.png", recursive=True):
              try:
                  im = Image.open(path)
                  w, h = im.size
                  splash_image(max(w, 320), max(h, 480), 0.32).save(path)
              except Exception:
                  pass

          # Force splash background color in styles if present
          for styles in glob.glob(res + "/**/styles.xml", recursive=True):
              try:
                  txt = open(styles).read()
                  txt2 = txt.replace("#FFFFFF", "#0A0E1C").replace("#ffffff", "#0A0E1C").replace("#FFF", "#0A0E1C")
                  if txt2 != txt:
                      open(styles, "w").write(txt2)
                      print("updated", styles)
              except Exception:
                  pass

          print("icons + splash OK")
          PY

      - name: Build Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CynExtra-AI-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
